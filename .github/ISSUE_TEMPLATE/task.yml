name: 任务卡
description: 一张可验收的开发任务（对齐 docs/tasks/TASK_TEMPLATE.md）
title: "[M?-??] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先阅读 `docs/tasks/TASK_TEMPLATE.md`。一次只做一张卡。

  - type: input
    id: task_id
    attributes:
      label: 编号
      description: 形如 M1-01
    validations:
      required: true

  - type: input
    id: assignee
    attributes:
      label: 指派
      description: agent:<名称> 或 人:<姓名>
    validations:
      required: true

  - type: textarea
    id: inputs
    attributes:
      label: 输入（前置依赖）
      description: 依赖的设计文档章节、数据/接口、前置任务卡编号
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 改动文件范围
      description: 允许修改/新增的路径；范围外一律不许动
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: 实现要求（逐条）
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准（可运行检查点）
      value: |
        - [ ] ...
        - [ ] pytest / godot --headless 通过
        - [ ] CI 绿
    validations:
      required: true

  - type: textarea
    id: redlines
    attributes:
      label: 禁止事项（红线）
      value: |
        - 不重构范围外代码、不改已定接口/信号签名、不发明新功能
        - 不调数值（数值一律进 database/game_data 或 JSON）
        - 不引入新依赖（如需新增，先写决策日志 D-xxx）
    validations:
      required: true
