# 共生之缚 Web 入口网关：TLS 终止 + 静态托管 + 后端反向代理 + 负载均衡
#
# 这个文件同时干三件事，讲的时候也按这三行拆：
#   1. 安全 —— 对外只开 80/443，后端 8000 与数据库 3306 都只活在内网
#   2. 分流 —— /api 走 upstream 地址池，三台后端轮流接
#   3. 兜底 —— 某台连续失败就摘掉，请求自动换下一台重试
#
# 由 deploy/Dockerfile.proxy 打进镜像；启动见 deploy/docker-compose.yml。

# ---------- 地址池 ----------
upstream symbiont_backend {
    # zone 不能省。不加的话每个 worker 各算各的轮询计数，
    # 请求量小的时候看起来全打到第一台（实测踩过，别删）。
    zone symbiont_backend 64k;

    # 调度算法。演示时换成 round_robin（注释掉这行即可）或 ip_hash 对比分布。
    # 这里默认 least_conn：谁手上连接少就给谁，比轮询更抗慢请求。
    least_conn;

    # 三台后端。max_fails=2 / fail_timeout=10s：
    # 连续失败 2 次就摘掉，10 秒后再试着放回来 —— 这就是"故障转移"。
    server server-1:8000 max_fails=2 fail_timeout=10s;
    server server-2:8000 max_fails=2 fail_timeout=10s;
    server server-3:8000 max_fails=2 fail_timeout=10s;

    # 到后端的连接复用，省掉每个请求一次 TCP 握手
    keepalive 16;
}

# ---------- 限流 ----------
# 代理是唯一入口，所以 $binary_remote_addr 就是真实客户端地址，可信。
# 如果前面还有一层（CDN / 云负载均衡），这里必须改用 realip 模块取真实 IP，
# 否则所有用户会被当成同一个 IP 一起限流。
limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=8r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# 限流默认返回 503（"服务不可用"），会把客户端搞糊涂：
# 503 像是服务坏了，429 才是"你请求太多了，慢一点"。
# 这两行只是把状态码换对，不影响拦不拦。
limit_req_status  429;
limit_conn_status 429;

# ---------- 明文入口：只做跳转 ----------
server {
    listen 80;
    server_name _;

    # 不做任何内容服务，一律跳到 HTTPS。
    # （演示"明文被看见"时走另一份 baseline 编排，那里连代理都没有。）
    return 308 https://$host$request_uri;
}

# ---------- HTTPS 入口 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 不对外报版本号。只能去版本，去不掉 "nginx" 这三个字母
    # （要彻底去掉得装 headers-more 模块，这里不做）。
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 下面这些头对所有响应生效。
    # 注意 nginx 的继承规则：location 里只要出现一个 add_header，
    # 这一整组就会被覆盖掉。所以各 location 只敢用 expires 控缓存。
    add_header X-Upstream $upstream_addr always;          # 这次是哪台后端接的
    add_header X-Content-Type-Options nosniff always;      # 禁止浏览器猜类型
    add_header X-Frame-Options SAMEORIGIN always;          # 防点击劫持
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # 请求体上限：远程存档没这么大，超过就是有人在灌包
    client_max_body_size 4m;
    client_header_timeout 15s;
    client_body_timeout 15s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    # Godot Web 导出为单页应用：找不到的路径一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;                                        # 入口页不许缓存
    }

    # 导出产物带内容哈希，可以长缓存。wasm/pck 动辄几十 MB，
    # 第二次进游戏全靠这里命中缓存。
    location ~* \.(wasm|pck|png|jpg|svg|woff2|ogg)$ {
        expires 30d;
    }

    # 后端反代：让 Web 版与后端同源访问 /api
    location /api/ {
        limit_req  zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://symbiont_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";                    # 配合 keepalive 复用

        # 把客户端信息传给后端。后端拿到的是代理的 IP，
        # 想知道真实来源只能读这几个头 —— 这就是"信任链"的起点。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 一台挂了自动换下一台，玩家看不到报错
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # 网关自己的探针，不记日志
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","layer":"proxy"}';
    }
}
