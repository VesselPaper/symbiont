# 三副本扩容叠加层
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.scale.yml up -d
#
# 它只做两件事：
#   1. 再起两台同镜像的后端（server-2、server-3），原来的 server 就是第一台
#   2. 把网关的地址池换成三台
#
# 主配置 docker-compose.yml 与 nginx 主模板都不改。副本数是部署决策，
# 需要时叠加一次，不需要时不要叠 —— 单机跑三台空转对本项目没有收益。
name: symbiont

services:
  server-2:
    image: symbiont-server:${IMAGE_TAG:-local}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      SYMBIONT_DATABASE_URL: "mysql+pymysql://${MYSQL_USER:-symbiont}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-symbiont}?charset=utf8mb4"
      SYMBIONT_INSTANCE: node-2
    expose:
      - "8000"
    mem_limit: 256m
    depends_on:
      mysql:
        condition: service_healthy

  server-3:
    image: symbiont-server:${IMAGE_TAG:-local}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      SYMBIONT_DATABASE_URL: "mysql+pymysql://${MYSQL_USER:-symbiont}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-symbiont}?charset=utf8mb4"
      SYMBIONT_INSTANCE: node-3
    expose:
      - "8000"
    mem_limit: 256m
    depends_on:
      mysql:
        condition: service_healthy

  proxy:
    environment:
      SYMBIONT_API_HOST_2: ${SYMBIONT_API_HOST_2:-server-2}
      SYMBIONT_API_HOST_3: ${SYMBIONT_API_HOST_3:-server-3}
    volumes:
      # 用三副本的地址池覆盖镜像里单副本那一份，主模板不动
      - ./nginx/scale/upstream.conf.template:/etc/nginx/templates/upstream.conf.template:ro
    depends_on:
      server:
        condition: service_healthy
      server-2:
        condition: service_healthy
      server-3:
        condition: service_healthy
